ShortDescription: Free remote desktop app - control a Mac, Windows PC or Linux computer from your Windows PC.
Description: |-
  Remio for Windows is the Windows app of Remio Remote Desktop (remio.net). Use it to see and control a Mac, another Windows PC, a Linux computer or a Raspberry Pi that runs the free Remio Host - at home or over the internet, without opening ports on your router.

  Up to 6K at 120 FPS with hardware H.264/H.265 (up to 240 fps on a faster display), full keyboard and mouse, the computer's sound, clipboard, file transfer and game controllers, several computers at once, and this PC as a second display for another computer. End-to-end encrypted and direct between your devices by default. Pair by typing the computer's Device ID and PIN - no account needed. Free with no time limit; Remio Pro is optional.

  Remio also has apps for iPhone, iPad, Android, Mac and Apple TV: https://remio.net/download

  Installs per-user - no admin required - and updates itself.
