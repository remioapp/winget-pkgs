ReleaseNotes: |-
  Remio Host 3.0.0 - Remio Host 3.0 brings file sharing to Windows — send files to the device you are connected from, receive files back, and find every transfer in a history under the name of the device it came from. A new Devices page shows how each device got access, lets you give it a name or take its access away, and keeps a 30-day log of pairings, refused attempts and session takeovers. Also fixed: updates that could leave Remio switched off, handing a session over to another device, and the automatic account pairing switch that did nothing when turned off.
ReleaseNotesUrl: https://github.com/remioapp/releases/releases/tag/v3.0.0-win
PurchaseUrl: https://remio.net/download.html
InstallationNotes: |-
  Remio Host installs to Program Files and registers a Windows Service (RemioHostSvc) that
  spawns the main app into your interactive session at sign-in. After install, look for
  the Remio icon in your system tray.
