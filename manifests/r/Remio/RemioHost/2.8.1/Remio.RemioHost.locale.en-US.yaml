ReleaseNotes: |-
  Remio Host 2.8.1 - the mouse pointer is the right size again.

  - Fixed: the pointer drawn on your phone, tablet or Mac could come out
    wildly wrong - about twice too big on some devices, and half the size
    it should be on others, so it never quite matched the screen you were
    pointing at. It is now drawn at its true size on every device you
    connect from.
ReleaseNotesUrl: https://github.com/remioapp/releases/releases/tag/v2.8.1-win
PurchaseUrl: https://remio.net/download.html
InstallationNotes: |-
  Remio Host installs to Program Files and registers a Windows Service (RemioHostSvc) that
  spawns the main app into your interactive session at sign-in. After install, look for
  the Remio icon in your system tray.
