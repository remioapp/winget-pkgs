ReleaseNotes: |-
  Remio Host 2.3.2 - reachable at the sign-in screen, 8 languages,
  real Xbox controllers, and direct connections through a port you
  forward.

  - Connect right at the Windows sign-in screen: a PC that restarted
    overnight is reachable before anyone signs in. On by default;
    turn it off any time in the Remio Host window.
  - Remio Host is now available in French, German, Japanese,
    Simplified Chinese, Hindi, and Brazilian Portuguese, joining
    English and Vietnamese.
  - Forward a single port on your router and connecting devices can
    ask to come in through exactly that port - a direct connection
    instead of a relayed one, quicker and sharper from outside your
    network.
  - Controllers connected to your phone or tablet appear to Windows
    games as genuine Xbox controllers - up to four at once, with
    vibration sent back to the player's hands.
  - New lock-screen controls: lock this PC automatically when a
    session ends, and choose whether connected devices may type your
    password at the lock screen.
  - A locked PC stays properly locked: clipboard sync, file drops,
    and app launches are blocked until you actually sign in.
  - Fixed a crash right as a device disconnects, displays coming
    back wrong after signing out, screens staying off for good after
    a dropped connection, and self-updates stranding a signed-out PC.
ReleaseNotesUrl: https://github.com/remioapp/releases/releases/tag/v2.3.2-win
PurchaseUrl: https://remio.net/download.html
InstallationNotes: |-
  Remio Host installs to Program Files and registers a Windows Service (RemioHostSvc) that
  spawns the main app into your interactive session at sign-in. After install, look for
  the Remio icon in your system tray.
