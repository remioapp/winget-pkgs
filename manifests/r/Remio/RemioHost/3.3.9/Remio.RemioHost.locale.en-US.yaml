ReleaseNotes: |-
  Remio Host 3.3.9 - This release is about speed. When your device shows this PC at 60 frames a second, what you type, click or scroll now appears in about half the time while this PC is plugged in, and the end of a scroll shows up right away. PCs with Intel graphics reach your devices up to 11 ms sooner and no longer pause when the picture adjusts; PCs with AMD graphics do less work on every frame, and an iPad in HDR runs at up to 120 frames a second on AMD built-in graphics. A phone or tablet used as a second display can no longer become this PC's main screen, and your sign-in now survives a restart.
ReleaseNotesUrl: https://github.com/remioapp/releases/releases/tag/v3.3.9-win
PurchaseUrl: https://remio.net/download.html
InstallationNotes: |-
  Remio Host installs to Program Files and registers a Windows Service (RemioHostSvc) that
  spawns the main app into your interactive session at sign-in. After install, look for
  the Remio icon in your system tray.
